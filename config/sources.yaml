version: "0.2"
timezone: Asia/Shanghai
lookback_hours: 30
max_items_per_feed: 25
max_selected: 5

# v0.2 quality controls
min_total: 50
min_editorial_signal: 20
default_source_cap: 2

category_caps:
  official: 3
  media: 2
  research: 1
  community: 1

sources:
  - id: openai
    name: OpenAI News
    tier: A
    url: https://openai.com/news/rss.xml
    category: official
    selection_cap: 2

  - id: huggingface
    name: Hugging Face Blog
    tier: A
    url: https://huggingface.co/blog/feed.xml
    category: official
    selection_cap: 2

  - id: mit_tech_review
    name: MIT Technology Review
    tier: B
    url: https://www.technologyreview.com/feed/
    category: media
    selection_cap: 2

  - id: arxiv_ai
    name: arXiv CS.AI
    tier: C
    url: https://rss.arxiv.org/rss/cs.AI
    category: research
    selection_cap: 1

  - id: hackernews_ai
    name: Hacker News AI Filter
    tier: C
    url: https://hnrss.org/frontpage?q=AI+OR+LLM+OR+GPT+OR+machine+learning
    category: community
    selection_cap: 1
