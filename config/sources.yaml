version: "0.4"
timezone: Asia/Shanghai

# Discovery window is slightly wider than the final editorial window
# to avoid missing global posts because of timezone / feed delay.
lookback_hours: 36
max_items_per_feed: 30
max_selected: 5
max_reserve: 8

min_total: 47
min_editorial_signal: 14
default_source_cap: 2

category_caps:
  official: 3
  marketing: 2
  media: 2
  research: 1
  community: 1

sources:
  - id: openai
    name: OpenAI News
    tier: A
    url: https://openai.com/news/rss.xml
    category: official
    selection_cap: 2
    allow_undated: false
    require_ai_signal: false

  - id: google_ai
    name: Google AI
    tier: A
    url: https://blog.google/technology/ai/rss/
    category: official
    selection_cap: 2
    allow_undated: false
    require_ai_signal: false

  - id: deepmind
    name: Google DeepMind
    tier: A
    url: https://deepmind.google/blog/rss.xml
    category: official
    selection_cap: 2
    allow_undated: false
    require_ai_signal: false

  - id: meta_news
    name: Meta Newsroom
    tier: A
    url: https://about.fb.com/news/feed/
    category: official
    selection_cap: 2
    allow_undated: false
    require_ai_signal: true

  - id: google_ads
    name: Google Ads & Commerce
    tier: A
    url: https://blog.google/products/ads-commerce/rss/
    category: marketing
    selection_cap: 2
    allow_undated: false
    require_ai_signal: true

  - id: huggingface
    name: Hugging Face Blog
    tier: A
    url: https://huggingface.co/blog/feed.xml
    category: official
    selection_cap: 2
    allow_undated: false
    require_ai_signal: false

  - id: mit_tech_review
    name: MIT Technology Review
    tier: B
    url: https://www.technologyreview.com/feed/
    category: media
    selection_cap: 2
    allow_undated: false
    require_ai_signal: true

  - id: arxiv_ai
    name: arXiv CS.AI
    tier: C
    url: https://rss.arxiv.org/rss/cs.AI
    category: research
    selection_cap: 1
    allow_undated: false
    require_ai_signal: true

  - id: hackernews_ai
    name: Hacker News AI Filter
    tier: C
    url: https://hnrss.org/frontpage?q=AI+OR+LLM+OR+GPT+OR+machine+learning
    category: community
    selection_cap: 1
    allow_undated: false
    require_ai_signal: true
